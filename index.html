<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0d10">
    <meta name="description" content="Ember. Find, install, manage, play.">
    <link rel="icon" type="image/png" href="/art/ember-flame.png">
    <link rel="stylesheet" href="/startup.css">
    <title>Ember</title>
  </head>
  <body>
    <header class="window-bar" aria-label="Ember window">
      <div class="window-brand"><img src="/art/ember-flame.png" alt=""><span>Ember</span></div>
      <div class="window-controls">
        <button type="button" data-window="minimize" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10"/></svg></button>
        <button type="button" data-window="maximize" aria-label="Maximize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx=".5"/></svg></button>
        <button type="button" data-window="close" aria-label="Close Ember"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg></button>
      </div>
    </header>
    <section id="startup" class="startup-screen" aria-label="Starting Ember">
      <div class="startup-brand"><img src="/art/ember-flame.png" alt=""><strong>EMBER</strong><span>MOD MANAGER</span></div>
      <p class="startup-status" role="status" aria-live="polite">Warming up your workspace…</p>
      <progress class="startup-progress" aria-label="Loading Ember"></progress>
      <p class="startup-detail" aria-live="polite" hidden></p>
      <p class="startup-error" role="alert" hidden></p>
      <div class="startup-actions" hidden><button type="button" data-action="retry-startup">Try again</button><button type="button" data-action="offline-startup">Open offline workspace</button></div>
      <small class="startup-caption">FIND · INSTALL · MANAGE · PLAY</small>
    </section>
    <div id="app" inert aria-hidden="true"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script src="/startup-fallback.js" defer></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
